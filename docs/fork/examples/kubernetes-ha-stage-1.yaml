apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlantis-ha
  namespace: atlantis
  # Add the platform workload-identity annotation for S3 access here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlantis-ha-repo-config
  namespace: atlantis
data:
  repos.yaml: |
    repos:
      - id: /.*/
    external_stores:
      plan_store:
        type: s3
        s3:
          bucket: replace-with-atlantis-plans
          region: eu-west-2
          prefix: plans
---
apiVersion: v1
kind: Service
metadata:
  name: atlantis-ha-headless
  namespace: atlantis
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: atlantis-ha
  ports:
    - name: http
      port: 4141
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: atlantis-ha
  namespace: atlantis
spec:
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: atlantis-ha
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlantis-ha
  namespace: atlantis
spec:
  serviceName: atlantis-ha-headless
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis-ha
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis-ha
    spec:
      serviceAccountName: atlantis-ha
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: atlantis-ha
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: atlantis-ha
      containers:
        - name: atlantis
          image: replace-with-phase-2-fork-image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4141
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ATLANTIS_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ATLANTIS_REPLICA_ADVERTISE_URL
              value: http://$(ATLANTIS_REPLICA_ID).atlantis-ha-headless.$(POD_NAMESPACE).svc.cluster.local:4141
            - name: ATLANTIS_REPLICA_DEPLOYMENT_ID
              value: replace-with-stable-deployment-id
            - name: ATLANTIS_INTERNAL_COMMAND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlantis-ha
                  key: internal-command-token
            - name: ATLANTIS_REPO_ALLOWLIST
              value: replace-with-vcs-host/organization/*
            - name: ATLANTIS_REPO_CONFIG
              value: /etc/atlantis/repos.yaml
            - name: ATLANTIS_DATA_DIR
              value: /var/lib/atlantis
            - name: ATLANTIS_LOCKING_DB_TYPE
              value: redis
            - name: ATLANTIS_REDIS_HOST
              value: replace-with-redis-primary
            - name: ATLANTIS_REDIS_PORT
              value: "6379"
            - name: ATLANTIS_RUN_STORE_TYPE
              value: postgres
            - name: ATLANTIS_RUN_STORE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: atlantis-ha
                  key: postgres-url
            - name: ATLANTIS_ENABLE_EXTERNAL_STORES
              value: "true"
            - name: ATLANTIS_OWNERSHIP_TTL_SECONDS
              value: "30"
            - name: ATLANTIS_SHUTDOWN_GRACE_PERIOD_SECONDS
              value: "540"
            - name: ATLANTIS_GH_USER
              valueFrom:
                secretKeyRef:
                  name: atlantis-ha
                  key: github-user
            - name: ATLANTIS_GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlantis-ha
                  key: github-token
            - name: ATLANTIS_GH_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlantis-ha
                  key: github-webhook-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/atlantis
            - name: repo-config
              mountPath: /etc/atlantis
              readOnly: true
      volumes:
        - name: repo-config
          configMap:
            name: atlantis-ha-repo-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlantis-ha
  namespace: atlantis
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis-ha
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlantis-ha
  namespace: atlantis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atlantis-ha
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: atlantis-ha
      ports:
        - protocol: TCP
          port: 4141
    # Label the ingress-controller namespace only after adapting this selector
    # to the cluster. Do not expose /internal/commands publicly.
    - from:
        - namespaceSelector:
            matchLabels:
              networking.atlantis.io/public-ingress: "true"
      ports:
        - protocol: TCP
          port: 4141
